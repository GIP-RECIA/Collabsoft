server:
  port: 8080
  servlet:
    context-path: /
  error:
    whitelabel.enabled: true
    include-binding-errors: always
    include-exception: true
    include-message: always
    include-stacktrace: always
  forward-headers-strategy: NATIVE

logging:
  config: 'classpath:logback-dev.xml'

spring:
  config:
    activate:
      on-profile: dev

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  jpa:
    show-sql: true

  datasource:
    url: jdbc:mariadb://HOST:3306/DB_NAME?useUnicode=true&characterEncoding=UTF-8&autoreconnect=true&useLegacyDatetimeCode=false&serverTimezone=Europe/Paris
    username:
    password:

app:
  cors:
    allowed-origins:
      -

  soffit:
    jwt-signature-key: ''

  storage:
    location: ''

  front:
    app-name: ''

    user-info-api-url: ''

    nextcloud-uri: '' # You can use domain variable in case of subdomain hosting (ex: 'https://nc.${domain}')

    collaboration:
      websocket-api-url: ''

    template-api-path: ''

    extended-uportal:
      header:
        component-path: ''
        props:
          template-api-url: ''

      footer:
        component-path: ''
        props:
          template-api-url: ''
